<script>
// ---- تنظیمات: فقط کلید anon را بگذار ----
const SUPABASE_URL='https://ssqqjkhzgcgojbacjitq.supabase.co';
const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzcXFqa2h6Z2Nnb2piYWNqaXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjczOTEsImV4cCI6MjEwNTE0MzM5MX0.0a9maOTpqGBRNs5mIVvNONXpYBauL8yjlY-O8EtsDxU';
// ----------------------------------------
// برای افزودن سایت سوم یک مورد به این آرایه اضافه کن (و در CSS یک .col.s3)
const SITES=[{k:'site1',c:'s1',n:'ازکی ایجنت',h:'azkiagent.com',logo:'brand/azki-agent.png'},{k:'site2',c:'s2',n:'شرکاء',h:'shoraka.net',logo:'brand/shoraka.png'}];
const FA={novin:'نوین',razi:'رازی',hekmat:'حکمت صبا',sina:'سینا',moalem:'معلم',mihan:'میهن',kowsar:'کوثر',pardis:'پردیس',dana:'دانا',alborz:'البرز',iran:'ایران',asia:'آسیا',ma:'ما',saman:'سامان',day:'دی',
 parsian:'پارسیان',pasargad:'پاسارگاد',karafarin:'کارآفرین',melat:'ملت',hafez:'حافظ',omid:'امید',taavon:'تعاون',sarmad:'سرمد',arman:'آرمان',hoshmand:'هوشمند',tejaratno:'تجارت‌نو'};
const FILE={kowsar:'kosar',moalem:'moallem'};
const STALE_HOURS=13; // workflow هر ۶ ساعت اجرا می‌شود
const logo=k=>'logos/bimeh-'+(FILE[k]||k)+'.png';
const fa=n=>n==null?null:Number(n).toLocaleString('fa-IR');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],failed=null,pinned=null,merged={};
const A=SITES[0],B=SITES[1];
const fa2=n=>n==null?null:Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
$('tt').onclick=()=>{const h=document.documentElement,t=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=t;try{localStorage.setItem('dashboardTheme',t)}catch(e){}};
async function load(){
 $('sub').textContent='در حال بارگذاری…';
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/current_commission?select=site,company_key,rate,captured_at&coverage=eq.third&order=rate.desc.nullslast',
   {headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY,'Accept-Profile':'compare'}});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));
  rows=await r.json();failed=null;$('sub').textContent='روی هر شرکت بزن تا همتایش در سایت دیگر و اختلاف نشان داده شود';
 }catch(e){failed=e.message;$('sub').textContent='ناموفق'}
 render();
}
function siteCard(s,list){
 const ts=list.map(r=>Date.parse(r.captured_at)).filter(Number.isFinite),last=ts.length?Math.max(...ts):null;
 const rates=list.map(r=>r.rate).filter(v=>v!=null),top=rates.length?Math.max(...rates):null;
 const best=top==null?null:list.find(r=>r.rate===top);
 let fresh='<div class="fresh">هنوز داده‌ای ثبت نشده</div>';
 if(last){const h=(Date.now()-last)/36e5,old=h>STALE_HOURS;
  fresh='<div class="fresh'+(old?' old':'')+'">آخرین داده: '+esc(new Date(last).toLocaleString('fa-IR'))+(old?' (بیش از '+fa(Math.floor(h))+' ساعت پیش)':'')+'</div>'}
 return'<div class="site"><div class="sh"><div><h2>'+esc(s.n)+'</h2><div class="host">'+esc(s.h)+'</div></div><span class="slogo"><img src="'+esc(s.logo)+'" alt="'+esc(s.n)+'"></span></div><div class="stats">'+
  '<div class="st"><b>'+fa(list.length)+'</b><span>شرکت در صفحه مقایسه</span></div>'+
  '<div class="st"><b>'+(top==null?'—':fa2(top)+'٪')+'</b><span>بیشترین کمیسیون'+(best?' · '+esc(FA[best.company_key]||best.company_key):'')+'</span></div></div>'+fresh+'</div>';
}
function cmp(c,s){
 const o=s===A?B:A,m=c[s.k],t=c[o.k];
 if(!m||!t)return null;
 if(m.rate==null||t.rate==null)return{t:'na'};
 const d=+m.rate-+t.rate;
 return d===0?{t:'eq'}:{t:d>0?'up':'down',d:Math.abs(d)};
}
function badge(c,s,both){
 if(!both)return'';
 const x=cmp(c,s);
 if(!x)return'<span class="bd only">فقط اینجا</span>';
 if(x.t==='eq')return'<span class="bd eq">برابر</span>';
 if(x.t==='na')return'';
 return x.t==='up'?'<span class="bd up">▲ '+fa2(x.d)+'٪ بیشتر</span>':'<span class="bd down">▼ '+fa2(x.d)+'٪ کمتر</span>';
}
function logoHtml(k){const n=FA[k]||k;return'<span class="logo" data-l="'+esc(n[0])+'"><img src="'+logo(k)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"></span>'}
function card(c,s,both){
 const r=c[s.k],k=c.k,v=r.rate,cls=v==null?'none':(+v===0?'zero':'');
 return'<button type="button" class="cc" data-k="'+esc(k)+'" aria-pressed="false">'+logoHtml(k)+
  '<b class="nm">'+esc(FA[k]||k)+'</b><small>'+esc(k)+'</small><span class="pill '+cls+'">'+(v==null?'—':fa2(v)+'٪')+'</span>'+badge(c,s,both)+'</button>';
}
function render(){
 pinned=null;panel(null);
 if(failed){$('cols').innerHTML='<div class="msg er">خطا در دریافت داده: '+esc(failed)+'</div>';return}
 const f=$('q').value.trim().toLowerCase();
 merged={};rows.forEach(r=>{(merged[r.company_key]||(merged[r.company_key]={k:r.company_key}))[r.site]=r});
 const both=rows.some(r=>r.site===A.k)&&rows.some(r=>r.site===B.k);
 const keys=Object.keys(merged).filter(k=>k.toLowerCase().includes(f)||(FA[k]||'').includes(f));
 const isShared=k=>merged[k][A.k]&&merged[k][B.k];
 const mx=k=>Math.max(+merged[k][A.k].rate||0,+merged[k][B.k].rate||0);
 // شرکت‌های مشترک در هر دو ستون با یک ترتیب می‌آیند تا همتاها روبه‌روی هم باشند
 const shared=keys.filter(isShared).sort((x,y)=>mx(y)-mx(x)||x.localeCompare(y));
 $('cols').innerHTML=SITES.map(s=>{
  const all=rows.filter(r=>r.site===s.k);
  const mine=keys.filter(k=>merged[k][s.k]&&!isShared(k)).sort((x,y)=>(+merged[y][s.k].rate||0)-(+merged[x][s.k].rate||0));
  let body;
  if(!all.length)body='<div class="msg">هنوز داده‌ای از این سایت ثبت نشده</div>';
  else if(!shared.length&&!mine.length)body='<div class="msg">شرکتی با این جستجو پیدا نشد</div>';
  else body='<div class="cards">'+
   (both&&shared.length?'<div class="grp">در هر دو سایت · '+fa(shared.length)+'</div>':'')+shared.map(k=>card(merged[k],s,both)).join('')+
   (both&&mine.length?'<div class="grp">فقط در '+esc(s.n)+' · '+fa(mine.length)+'</div>':'')+mine.map(k=>card(merged[k],s,both)).join('')+'</div>';
  return'<section class="col '+s.c+'">'+siteCard(s,all)+body+'</section>';
 }).join('')+'<svg class="ln" id="ln" aria-hidden="true"></svg>';
}
function cardsOf(k){return[...document.querySelectorAll('.cc')].filter(e=>e.dataset.k===k)}
function line(k){
 const svg=$('ln');if(!svg)return;svg.innerHTML='';
 if(!k||innerWidth<=860)return;
 const els=cardsOf(k);if(els.length<2)return;
 const rc=$('cols').getBoundingClientRect(),r=els.map(e=>e.getBoundingClientRect()).sort((p,q)=>p.left-q.left);
 const x1=r[0].right-rc.left,y1=r[0].top+r[0].height/2-rc.top,x2=r[1].left-rc.left,y2=r[1].top+r[1].height/2-rc.top,m=(x1+x2)/2;
 svg.innerHTML='<defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="'+x1+'" y1="0" x2="'+x2+'" y2="0"><stop offset="0" stop-color="#F2BE1A"/><stop offset="1" stop-color="#1656F5"/></linearGradient></defs>'+
  '<path d="M'+x1+' '+y1+'C'+m+' '+y1+' '+m+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round"/>'+
  '<circle cx="'+x1+'" cy="'+y1+'" r="5" fill="#F2BE1A"/><circle cx="'+x2+'" cy="'+y2+'" r="5" fill="#1656F5"/>';
}
function focus(k){
 document.querySelectorAll('.cc.hl').forEach(e=>e.classList.remove('hl'));
 $('cols').classList.toggle('focus',!!k);
 if(k)cardsOf(k).forEach(e=>e.classList.add('hl'));
 line(k);
}
function press(){document.querySelectorAll('.cc').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.k===pinned)))}
function panel(k){
 const dp=$('dp');
 if(!k||!merged[k]){dp.hidden=true;dp.innerHTML='';return}
 const c=merged[k],a=c[A.k],b=c[B.k],name=esc(FA[k]||k);
 const val=r=>r&&r.rate!=null?fa2(r.rate)+'٪':'—';
 let verdict;
 if(!a||!b)verdict='فقط در صفحه مقایسه '+esc((a?A:B).n)+' دیده می‌شود و '+esc((a?B:A).n)+' آن را نشان نمی‌دهد';
 else if(a.rate==null||b.rate==null)verdict='کمیسیون یکی از دو سایت ثبت نشده';
 else if(+a.rate===+b.rate)verdict='هر دو سایت یک کمیسیون نشان می‌دهند';
 else{
  const hi=+a.rate>+b.rate?A:B,lo=hi===A?B:A,H=Math.max(+a.rate,+b.rate),L=Math.min(+a.rate,+b.rate),d=H-L;
  verdict=esc(hi.n)+' '+fa2(d)+' واحد درصد بیشتر از '+esc(lo.n)+' می‌دهد'+(L>0?' ('+fa2(Math.round(d/L*1000)/10)+'٪ بیشتر از مقدار کمتر)':'');
 }
 dp.innerHTML='<div class="dp-h">'+logoHtml(k)+'<div class="tt"><b>'+name+'</b><small>'+esc(k)+'</small></div><button type="button" class="x" id="dpx" aria-label="بستن">×</button></div>'+
  '<div class="dp-v"><div class="v s1"><span>'+esc(A.n)+'</span><b>'+val(a)+'</b></div><div class="vs">در برابر</div><div class="v s2"><span>'+esc(B.n)+'</span><b>'+val(b)+'</b></div></div>'+
  '<div class="dp-t">'+verdict+'</div>';
 dp.hidden=false;
}
function unpin(){pinned=null;focus(null);panel(null);press()}
$('cols').addEventListener('click',e=>{const c=e.target.closest('.cc');if(!c)return;const k=c.dataset.k;pinned=pinned===k?null:k;focus(pinned);panel(pinned);press()});
$('cols').addEventListener('mouseover',e=>{if(pinned)return;const c=e.target.closest('.cc');if(c)focus(c.dataset.k)});
$('cols').addEventListener('mouseout',e=>{if(pinned)return;const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest('.cc'):null;if(!to)focus(null)});
$('dp').addEventListener('click',e=>{if(e.target.closest('#dpx'))unpin()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pinned)unpin()});
addEventListener('resize',()=>line(pinned));
$('q').oninput=render;$('r').onclick=load;load();
</script>
</body>
</html>
