<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>مقایسه کمیسیون بیمه ثالث</title>
<script>
(function(){try{var s=localStorage.getItem('dashboardTheme');
document.documentElement.setAttribute('data-theme',s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));}catch(e){}})();
</script>
<style>
@font-face{font-family:'IRANSansX';font-weight:400;font-display:swap;src:url('fonts/IRANSansX-400.woff2') format('woff2')}
@font-face{font-family:'IRANSansX';font-weight:600;font-display:swap;src:url('fonts/IRANSansX-600.woff2') format('woff2')}
@font-face{font-family:'IRANSansX';font-weight:700;font-display:swap;src:url('fonts/IRANSansX-700.woff2') format('woff2')}
@font-face{font-family:'IRANSansX';font-weight:900;font-display:swap;src:url('fonts/IRANSansX-900.woff2') format('woff2')}
:root{--surface:rgba(255,255,255,.72);--surface-tint:rgba(217,236,255,.55);--ink:#0F1B33;--ink-soft:rgba(15,27,51,.68);--ink-faint:rgba(15,27,51,.46);
--line:rgba(23,169,255,.32);--accent:#00B4FF;--accent-deep:#1656F5;--accent-soft:rgba(0,180,255,.20);--accent-strong:#0D8FCB;--danger:#E0453F;
--good:#1FA971;--good-soft:rgba(31,169,113,.16);--radius-lg:20px;--radius:14px;--radius-sm:9px;--blur:18px;
--shadow:0 8px 28px rgba(15,72,150,.14),inset 0 1px 0 rgba(255,255,255,.6);--topbar:rgba(255,255,255,.4);--font:'IRANSansX',Tahoma,sans-serif}
html[data-theme=dark]{--surface:rgba(255,255,255,.07);--surface-tint:rgba(255,255,255,.04);--ink:#EAF0FB;--ink-soft:rgba(234,240,251,.68);--ink-faint:rgba(234,240,251,.44);
--line:rgba(255,255,255,.14);--accent-strong:#29C2FF;--danger:#FF6B64;--good:#34C98C;--good-soft:rgba(52,201,140,.18);
--shadow:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);--topbar:rgba(10,15,28,.22);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:#0c1226;color:var(--ink);min-height:100vh}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;animation:gs 24s ease-in-out infinite;
background:radial-gradient(620px 520px at 12% -8%,rgba(0,180,255,.55),transparent 62%),radial-gradient(680px 540px at 106% 6%,rgba(124,92,224,.4),transparent 62%),
radial-gradient(700px 560px at 88% 102%,rgba(255,105,170,.32),transparent 62%),radial-gradient(640px 520px at 4% 104%,rgba(31,169,113,.3),transparent 62%),
linear-gradient(160deg,#CDE8FF 0%,#EAF4FE 45%,#FFF 100%)}
html[data-theme=dark] .bg-glow{background:radial-gradient(620px 520px at 12% -8%,rgba(0,180,255,.32),transparent 60%),radial-gradient(680px 540px at 106% 6%,rgba(76,141,255,.28),transparent 60%),
radial-gradient(700px 560px at 88% 102%,rgba(156,135,240,.26),transparent 60%),radial-gradient(640px 520px at 4% 104%,rgba(52,201,140,.2),transparent 60%),
linear-gradient(135deg,#05070f,#060a16 55%,#04070d)}
@keyframes gs{50%{filter:saturate(1.18) hue-rotate(10deg)}}
@media(prefers-reduced-motion:reduce){.bg-glow{animation:none}}
.theme-toggle{position:fixed;bottom:16px;left:16px;z-index:99;width:42px;height:42px;border-radius:50%;background:var(--surface);backdrop-filter:blur(14px) saturate(180%);
-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.theme-toggle svg{width:20px;height:20px}.theme-toggle .sun{display:none}
html[data-theme=dark] .theme-toggle .sun{display:block}html[data-theme=dark] .theme-toggle .moon{display:none}
#app{position:relative;z-index:1}
header.topbar{position:sticky;top:0;z-index:10;background:var(--topbar);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 6px 16px -6px rgba(22,86,245,.5)}
.brand h1{font-size:15px;font-weight:700;margin:0}.sync{font-size:12px;color:var(--ink-faint)}
button.ghost{background:none;border:none;color:var(--ink-soft);font:inherit;font-size:13px;cursor:pointer;padding:0}button.ghost:hover{color:var(--accent-strong)}
main{max-width:1040px;margin:0 auto;padding:28px 24px 70px}
.summary{display:grid;gap:14px;margin-bottom:24px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.sc{position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;min-height:104px;padding:18px 20px;
background:linear-gradient(135deg,rgba(22,86,245,.62),rgba(23,169,255,.62));backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
border:1px solid rgba(255,255,255,.4);border-radius:var(--radius-lg);box-shadow:0 16px 34px -16px rgba(22,86,245,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.sc::after{content:"";position:absolute;inset:0;background:radial-gradient(140px 140px at 90% 0,rgba(255,255,255,.25),transparent 70%)}
.sc .l{font-size:12px;color:rgba(255,255,255,.88);position:relative}.sc .v{font-size:34px;font-weight:900;color:#fff;line-height:1.3;position:relative}
.sc .s{font-size:12px;color:rgba(255,255,255,.85);position:relative;display:flex;align-items:center;gap:6px}
.sc .s img{width:20px;height:20px;border-radius:5px;background:#fff;padding:2px}
.search{width:100%;background:var(--surface-tint);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:11px 15px;color:var(--ink);font:inherit;font-size:13.5px;margin-bottom:18px;box-shadow:inset 0 1px 4px rgba(15,72,150,.1)}
.search:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.panel{background:var(--surface);backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--line);border-radius:var(--radius-lg);overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:680px}
th{padding:11px 16px;font-size:12px;font-weight:600;color:var(--ink-faint);text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;font-size:13.5px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th:first-child,td:first-child{text-align:right}tbody tr{transition:background .12s}tbody tr:hover{background:var(--surface-tint)}tbody tr:last-child td{border-bottom:0}
.co{display:flex;align-items:center;gap:12px}
.logo{position:relative;width:44px;height:44px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px -6px rgba(15,72,150,.35);overflow:hidden;
display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--accent-deep)}
.logo::before{content:attr(data-l)}.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#fff}
.nm b{display:block;font-size:14px}.nm small{color:var(--ink-faint);font-size:11px;direction:ltr;display:inline-block}
.bar{height:5px;border-radius:3px;background:var(--accent-soft);margin-top:6px;width:130px;max-width:100%}.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}
.pill{display:inline-block;min-width:54px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-weight:700;direction:ltr}
.pill.best{background:var(--good-soft);color:var(--good)}.na{color:var(--ink-faint)}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;background:var(--surface-tint);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.msg{padding:44px 18px;text-align:center;color:var(--ink-faint);font-size:13px}.msg.er{color:var(--danger)}
@media(max-width:560px){header.topbar{padding:12px 16px}main{padding:20px 12px 70px}th,td{padding:9px 8px}.logo{width:38px;height:38px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<button class="theme-toggle" id="tt" aria-label="تغییر تم">
<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<div id="app">
<header class="topbar">
 <div class="brand"><div class="avatar">٪</div><div><h1>مقایسه کمیسیون بیمه ثالث</h1><div class="sync" id="sub">در حال بارگذاری…</div></div></div>
 <button class="ghost" id="r">↻ بروزرسانی</button>
</header>
<main>
 <div class="summary" id="cards"></div>
 <input class="search" id="q" placeholder="جستجوی شرکت (نام فارسی یا انگلیسی)">
 <div class="panel"><table><thead><tr><th>شرکت</th><th>سایت ۱<br>(آزکی)</th><th>سایت ۲<br>(شوراکا)</th><th>سایت ۳</th><th>بیشترین</th><th>بهترین سایت</th><th>اختلاف٪</th></tr></thead><tbody id="b"></tbody></table></div>
</main>
</div>
<script>
// ---- تنظیمات: فقط کلید anon را بگذار ----
const SUPABASE_URL='https://ssqqjkhzgcgojbacjitq.supabase.co';
const ANON_KEY='PUT_ANON_KEY_HERE';
// ----------------------------------------
const SITES={site1:'آزکی‌ایجنت',site2:'شوراکا',site3:'سایت ۳'};
const FA={novin:'نوین',razi:'رازی',hekmat:'حکمت صبا',sina:'سینا',moalem:'معلم',mihan:'میهن',kowsar:'کوثر',pardis:'پردیس',dana:'دانا',alborz:'البرز',iran:'ایران',asia:'آسیا',ma:'ما',saman:'سامان',day:'دی',
 parsian:'پارسیان',pasargad:'پاسارگاد',karafarin:'کارآفرین',melat:'ملت',hafez:'حافظ',omid:'امید',taavon:'تعاون',sarmad:'سرمد',arman:'آرمان',hoshmand:'هوشمند',tejaratno:'تجارت‌نو'};
const FILE={kowsar:'kosar',moalem:'moallem'};
const logo=k=>'logos/bimeh-'+(FILE[k]||k)+'.png';
const fa=n=>n==null?null:Number(n).toLocaleString('fa-IR');
const $=id=>document.getElementById(id);
let rows=[];
$('tt').onclick=()=>{const h=document.documentElement,t=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=t;try{localStorage.setItem('dashboardTheme',t)}catch(e){}};
async function load(){
 $('sub').textContent='در حال بارگذاری…';
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/commission_compare?select=*&order=max_rate.desc.nullslast',{headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY,'Accept-Profile':'compare'}});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
  rows=await r.json();$('sub').textContent='آخرین بارگذاری: '+new Date().toLocaleString('fa-IR');render();
 }catch(e){$('b').innerHTML='<tr><td colspan="7" class="msg er">خطا در دریافت داده: '+e.message+'</td></tr>';$('sub').textContent='ناموفق';}
}
function render(){
 const f=$('q').value.trim().toLowerCase(),top=Math.max(1,...rows.map(r=>+r.max_rate||0));
 const list=rows.filter(r=>r.company_key.toLowerCase().includes(f)||(FA[r.company_key]||'').includes(f));
 const avg=rows.length?rows.reduce((a,r)=>a+(+r.max_rate||0),0)/rows.length:0,b=rows[0];
 $('cards').innerHTML='<div class="sc"><div class="l">تعداد شرکت</div><div class="v">'+fa(rows.length)+'</div></div>'+
  '<div class="sc"><div class="l">بیشترین کمیسیون</div><div class="v">'+fa(top)+'٪</div>'+(b?'<div class="s"><img src="'+logo(b.company_key)+'" alt="">'+(FA[b.company_key]||b.company_key)+'</div>':'')+'</div>'+
  '<div class="sc"><div class="l">میانگین کمیسیون</div><div class="v">'+fa(Math.round(avg*10)/10)+'٪</div></div>';
 if(!list.length){$('b').innerHTML='<tr><td colspan="7" class="msg">داده‌ای نیست</td></tr>';return;}
 $('b').innerHTML=list.map(r=>{
  const n=FA[r.company_key]||r.company_key,m=+r.max_rate||0;
  const cell=s=>{const v=r[s];if(v==null)return'<td><span class="na">—</span></td>';return'<td><span class="pill'+(+v===m&&m>0?' best':'')+'">'+fa(v)+'</span></td>'};
  return'<tr><td><div class="co"><span class="logo" data-l="'+n[0]+'"><img src="'+logo(r.company_key)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"></span>'+
   '<div class="nm"><b>'+n+'</b><small>'+r.company_key+'</small><div class="bar"><i style="width:'+Math.round(m/top*100)+'%"></i></div></div></div></td>'+
   cell('site1')+cell('site2')+cell('site3')+'<td><b>'+fa(m)+'٪</b></td>'+
   '<td>'+(m>0?'<span class="tag">'+(SITES[r.best_site]||r.best_site)+'</span>':'<span class="na">—</span>')+'</td>'+
   '<td>'+(r.spread_pct==null?'<span class="na">—</span>':fa(r.spread_pct))+'</td></tr>';
 }).join('');
}
$('q').oninput=render;$('r').onclick=load;load();
</script>
</body>
</html>
