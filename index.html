.dp-h .tt{flex:1;min-width:0}
.dp-h b{display:block;font-size:15px}
.dp-h small{color:var(--ink-faint);direction:ltr;display:block;font-size:11px;text-align:right}
.dp .x{background:none;border:0;font-size:24px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 8px}
.dp-v{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;align-items:center;margin:14px 0 10px;text-align:center}
.dp-v .v{border-radius:var(--radius);padding:8px 6px;background:var(--surface-tint)}
.dp-v .v span{display:block;font-size:12px;color:var(--ink-soft)}
.dp-v .v b{font-size:22px;font-weight:900}
.dp-v .v.s1 b{color:var(--s1)}.dp-v .v.s2 b{color:var(--s2)}.dp-v .v.s3 b{color:var(--s3)}
.dp-v .vs{font-size:12px;color:var(--ink-faint)}
.dp-t{font-size:13.5px;font-weight:600;text-align:center;line-height:1.7}
@media(max-width:700px){header.topbar{flex-direction:column;gap:6px;padding:12px 16px}header.topbar #r{position:static;transform:none}.site .st+.st{border-inline-start:0;margin-top:10px}.dp{left:68px;right:12px;width:auto;transform:none}}
@media(prefers-reduced-motion:reduce){.cc{transition:none}.cc.hl{transform:none}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<button class="theme-toggle" id="tt" aria-label="تغییر تم">
<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<div id="app">
<header class="topbar">
 <div class="brand"><div><h1>مقایسه صفحه کامپیر ثالث شرکت‌ها</h1><div class="sync" id="sub">در حال بارگذاری…</div></div></div>
 <button class="ghost" id="r">↻ بروزرسانی</button>
</header>
<main>
 <input class="search" id="q" placeholder="جستجوی شرکت (نام فارسی یا انگلیسی)">
 <div class="cols" id="cols"></div>
</main>
<div class="dp" id="dp" hidden role="dialog" aria-label="جزئیات مقایسه"></div>
</div>
<script>
// داده‌ها در پوشه‌ی data همین مخزن ثبت می‌شوند: data/<site>.json
const DATA_DIR='data/';
const SITES=[ // ترتیب در صفحه‌ی راست‌به‌چپ: اولی راست، دومی وسط، سومی چپ
 {k:'site3',c:'s3',n:'بیمه پلاس',h:'plusbimeh.com',logo:'brand/plusbimeh.png'},
 {k:'site1',c:'s1',n:'ازکی ایجنت',h:'azkiagent.com',logo:'brand/azki-agent.png'},
 {k:'site2',c:'s2',n:'شرکاء',h:'shoraka.net',logo:'brand/shoraka.png'}];
const SITE_COLOR={s1:'#1656F5',s2:'#F59E0B',s3:'#7A47C2'};
document.documentElement.style.setProperty('--n',SITES.length);
const FA={novin:'نوین',razi:'رازی',hekmat:'حکمت صبا',sina:'سینا',moalem:'معلم',mihan:'میهن',kowsar:'کوثر',pardis:'پردیس',dana:'دانا',alborz:'البرز',iran:'ایران',asia:'آسیا',ma:'ما',saman:'سامان',day:'دی',
 parsian:'پارسیان',pasargad:'پاسارگاد',karafarin:'کارآفرین',melat:'ملت',hafez:'حافظ',omid:'امید',taavon:'تعاون',sarmad:'سرمد',arman:'آرمان',hoshmand:'هوشمند',tejaratno:'تجارت‌نو'};
const FILE={kowsar:'kosar',moalem:'moallem'};
const STALE_HOURS=13; // workflow هر ۶ ساعت اجرا می‌شود
const logo=k=>'logos/bimeh-'+(FILE[k]||k)+'.png';
const fa=n=>n==null?null:Number(n).toLocaleString('fa-IR');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],failed=null,pinned=null,merged={};
const fa2=n=>n==null?null:Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
$('tt').onclick=()=>{const h=document.documentElement,t=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=t;try{localStorage.setItem('dashboardTheme',t)}catch(e){}};
async function load(){
 $('sub').textContent='در حال بارگذاری…';
 try{
  const res=await Promise.all(SITES.map(async s=>{
   const r=await fetch(DATA_DIR+s.k+'.json?t='+Date.now(),{cache:'no-store'});
   if(r.status===404)return[];
   if(!r.ok)throw new Error(s.k+': HTTP '+r.status);
   const d=await r.json(),seen=new Set();
   return(d.rows||[]).filter(x=>{if(seen.has(x.company_key))return false;seen.add(x.company_key);return true})
    .map(x=>({site:s.k,company_key:x.company_key,rate:x.rate,captured_at:x.captured_at||d.captured_at}));
  }));
  rows=res.flat();failed=null;$('sub').textContent='روی هر شرکت بزن تا همتایش در سایت‌های دیگر و اختلاف نشان داده شود';
 }catch(e){failed=e.message;$('sub').textContent='ناموفق'}
 render();
}
function siteCard(s,list){
 const ts=list.map(r=>Date.parse(r.captured_at)).filter(Number.isFinite),last=ts.length?Math.max(...ts):null;
 const rates=list.map(r=>r.rate).filter(v=>v!=null),top=rates.length?Math.max(...rates):null;
 const best=top==null?null:list.find(r=>r.rate===top);
 let fresh='<div class="fresh">هنوز داده‌ای ثبت نشده</div>';
 if(last){const h=(Date.now()-last)/36e5,old=h>STALE_HOURS;
  fresh='<div class="fresh'+(old?' old':'')+'">آخرین داده: '+esc(new Date(last).toLocaleString('fa-IR'))+(old?' (بیش از '+fa(Math.floor(h))+' ساعت پیش)':'')+'</div>'}
 return'<div class="site"><div class="sh"><div><h2>'+esc(s.n)+'</h2><div class="host">'+esc(s.h)+'</div></div><span class="slogo"><img src="'+esc(s.logo)+'" alt="'+esc(s.n)+'" onerror="this.style.display=\'none\'"></span></div><div class="glass"><div class="stats">'+
  '<div class="st"><b>'+fa(list.length)+'</b><span>شرکت در صفحه مقایسه</span></div>'+
  '<div class="st"><b>'+(top==null?'—':fa2(top)+'٪')+'</b><span>بیشترین کارمزد'+(best?' · '+esc(FA[best.company_key]||best.company_key):'')+'</span></div></div>'+fresh+'</div></div>';
}
function cmp(c,s){
 const m=c[s.k];
 if(!m)return null;
 const others=SITES.filter(o=>o!==s&&c[o.k]);
 if(!others.length)return null;
 if(m.rate==null)return{t:'na'};
 const rs=others.map(o=>c[o.k].rate).filter(v=>v!=null).map(Number);
 if(!rs.length)return{t:'na'};
 const d=+m.rate-Math.max(...rs);
 return d===0?{t:'eq'}:{t:d>0?'up':'down',d:Math.abs(d)};
}
function badge(c,s,both){
 if(!both)return'';
 const x=cmp(c,s);
 if(!x)return'<span class="bd only">فقط اینجا</span>';
 if(x.t==='eq')return'<span class="bd eq">برابر</span>';
 if(x.t==='na')return'';
 return x.t==='up'?'<span class="bd up">▲ '+fa2(x.d)+'٪ بیشتر</span>':'<span class="bd down">▼ '+fa2(x.d)+'٪ کمتر</span>';
}
function logoHtml(k){const n=FA[k]||k;return'<span class="logo" data-l="'+esc(n[0])+'"><img src="'+logo(k)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"></span>'}
function card(c,s,both){
 const r=c[s.k],k=c.k,v=r.rate,cls=v==null?'none':(+v===0?'zero':'');
 return'<button type="button" class="cc" data-k="'+esc(k)+'" aria-pressed="false">'+logoHtml(k)+
  '<b class="nm">'+esc(FA[k]||k)+'</b><small>'+esc(k)+'</small><span class="pill '+cls+'">'+(v==null?'—':fa2(v)+'٪')+'</span>'+badge(c,s,both)+'</button>';
}
function render(){
 pinned=null;panel(null);
 if(failed){$('cols').innerHTML='<div class="msg er">خطا در دریافت داده: '+esc(failed)+'</div>';return}
 const f=$('q').value.trim().toLowerCase();
 merged={};rows.forEach(r=>{(merged[r.company_key]||(merged[r.company_key]={k:r.company_key}))[r.site]=r});
 const present=SITES.filter(s=>rows.some(r=>r.site===s.k)),multi=present.length>1;
 const keys=Object.keys(merged).filter(k=>k.toLowerCase().includes(f)||(FA[k]||'').includes(f));
 const cnt=k=>present.filter(s=>merged[k][s.k]).length;
 const mx=k=>Math.max(0,...SITES.filter(s=>merged[k][s.k]).map(s=>+merged[k][s.k].rate||0));
 const byMax=(x,y)=>mx(y)-mx(x)||x.localeCompare(y);
 // شرکت‌های مشترک در همه‌ی ستون‌ها با یک ترتیب می‌آیند تا همتاها روبه‌روی هم باشند
 const full=multi?keys.filter(k=>cnt(k)===present.length).sort(byMax):[];
 const partAll=multi?keys.filter(k=>cnt(k)>1&&cnt(k)<present.length).sort(byMax):[];
 $('cols').innerHTML=SITES.map(s=>{
  const all=rows.filter(r=>r.site===s.k);
  const part=partAll.filter(k=>merged[k][s.k]);
  const mine=keys.filter(k=>merged[k][s.k]&&(!multi||cnt(k)===1)).sort((x,y)=>(+merged[y][s.k].rate||0)-(+merged[x][s.k].rate||0));
  const mineFull=all.length?full:[];
  let body;
  if(!all.length)body='<div class="msg">هنوز داده‌ای از این سایت ثبت نشده</div>';
  else if(!mineFull.length&&!part.length&&!mine.length)body='<div class="msg">شرکتی با این جستجو پیدا نشد</div>';
  else body='<div class="cards">'+
   (multi&&mineFull.length?'<div class="grp">'+(present.length===SITES.length?'در همه سایت‌ها':'در هر '+fa(present.length)+' سایت')+' · '+fa(mineFull.length)+'</div>':'')+mineFull.map(k=>card(merged[k],s,multi)).join('')+
   (multi&&partAll.length?'<div class="grp">در چند سایت · '+fa(part.length)+'</div>':'')+partAll.map(k=>merged[k][s.k]?card(merged[k],s,multi):'<div class="cc ph" aria-hidden="true"></div>').join('')+
   (multi&&mine.length?'<div class="grp">فقط در '+esc(s.n)+' · '+fa(mine.length)+'</div>':'')+mine.map(k=>card(merged[k],s,multi)).join('')+'</div>';
  return'<section class="col '+s.c+'">'+siteCard(s,all)+body+'</section>';
 }).join('')+'<svg class="ln" id="ln" aria-hidden="true"></svg>';
 align();
}
function align(){
 const eq=sel=>{const a=[...document.querySelectorAll(sel)];a.forEach(e=>e.style.minHeight='');
  const m=Math.max(0,...a.map(e=>e.getBoundingClientRect().height));a.forEach(e=>e.style.minHeight=m+'px')};
 eq('.site');eq('.cc');line(pinned);
}
function cardsOf(k){return[...document.querySelectorAll('.cc')].filter(e=>e.dataset.k===k)}
function line(k){
 const svg=$('ln');if(!svg)return;svg.innerHTML='';
 if(!k||innerWidth<=1100)return;
 const els=cardsOf(k);if(els.length<2)return;
 const rc=$('cols').getBoundingClientRect();
 const r=els.map(e=>({b:e.getBoundingClientRect(),c:SITE_COLOR[[...e.closest('.col').classList].find(x=>/^s\d$/.test(x))]||'#888'})).sort((p,q)=>p.b.left-q.b.left);
 let d='',defs='',dots='';
 for(let i=0;i<r.length-1;i++){
  const a=r[i],b=r[i+1];
  const x1=a.b.right-rc.left,y1=a.b.top+a.b.height/2-rc.top,x2=b.b.left-rc.left,y2=b.b.top+b.b.height/2-rc.top,m=(x1+x2)/2;
  defs+='<linearGradient id="lg'+i+'" gradientUnits="userSpaceOnUse" x1="'+x1+'" y1="0" x2="'+x2+'" y2="0"><stop offset="0" stop-color="'+a.c+'"/><stop offset="1" stop-color="'+b.c+'"/></linearGradient>';
  d+='<path d="M'+x1+' '+y1+'C'+m+' '+y1+' '+m+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="url(#lg'+i+')" stroke-width="3.5" stroke-linecap="round"/>';
  dots+='<circle cx="'+x1+'" cy="'+y1+'" r="5" fill="'+a.c+'"/><circle cx="'+x2+'" cy="'+y2+'" r="5" fill="'+b.c+'"/>';
 }
 svg.innerHTML='<defs>'+defs+'</defs>'+d+dots;
}
function focus(k){
 document.querySelectorAll('.cc.hl').forEach(e=>e.classList.remove('hl'));
 $('cols').classList.toggle('focus',!!k);
 if(k)cardsOf(k).forEach(e=>e.classList.add('hl'));
 line(k);
}
function press(){document.querySelectorAll('.cc').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.k===pinned)))}
function panel(k){
 const dp=$('dp');
 if(!k||!merged[k]){dp.hidden=true;dp.innerHTML='';return}
 const c=merged[k],name=esc(FA[k]||k),have=SITES.filter(s=>c[s.k]);
 const val=r=>r&&r.rate!=null?fa2(r.rate)+'٪':'—';
 let verdict;
 const w=have.filter(s=>c[s.k].rate!=null);
 if(have.length===1)verdict='فقط در صفحه مقایسه '+esc(have[0].n)+' دیده می‌شود و سایت‌های دیگر آن را نشان نمی‌دهند';
 else if(w.length<2)verdict='کارمزد برای مقایسه کافی ثبت نشده';
 else{
  const H=Math.max(...w.map(s=>+c[s.k].rate)),L=Math.min(...w.map(s=>+c[s.k].rate));
  if(H===L)verdict='همه سایت‌ها یک کارمزد نشان می‌دهند';
  else{
   const hi=w.filter(s=>+c[s.k].rate===H),lo=w.filter(s=>+c[s.k].rate===L),d=H-L;
   verdict=hi.map(s=>esc(s.n)).join(' و ')+' '+fa2(d)+' واحد درصد بیشتر از '+lo.map(s=>esc(s.n)).join(' و ')+(hi.length>1?' می‌دهند':' می‌دهد')+(L>0?' ('+fa2(Math.round(d/L*1000)/10)+'٪ بیشتر از مقدار کمتر)':'');
  }
 }
 dp.innerHTML='<div class="dp-h">'+logoHtml(k)+'<div class="tt"><b>'+name+'</b><small>'+esc(k)+'</small></div><button type="button" class="x" id="dpx" aria-label="بستن">×</button></div>'+
  '<div class="dp-v">'+SITES.map(s=>'<div class="v '+s.c+'"><span>'+esc(s.n)+'</span><b>'+val(c[s.k])+'</b></div>').join('')+'</div>'+
  '<div class="dp-t">'+verdict+'</div>';
 dp.hidden=false;
}
function unpin(){pinned=null;focus(null);panel(null);press()}
$('cols').addEventListener('click',e=>{const c=e.target.closest('.cc');if(!c)return;const k=c.dataset.k;pinned=pinned===k?null:k;focus(pinned);panel(pinned);press()});
$('cols').addEventListener('mouseover',e=>{if(pinned)return;const c=e.target.closest('.cc');if(c)focus(c.dataset.k)});
$('cols').addEventListener('mouseout',e=>{if(pinned)return;const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest('.cc'):null;if(!to)focus(null)});
$('dp').addEventListener('click',e=>{if(e.target.closest('#dpx'))unpin()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pinned)unpin()});
addEventListener('resize',align);addEventListener('load',align);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(align);
$('q').oninput=render;$('r').onclick=load;load();
</script>
</body>
</html>
