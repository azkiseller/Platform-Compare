function cmp(c,s){

 if(m.rate==null)return{t:'na'};
 const rs=others.map(o=>c[o.k].rate).filter(v=>v!=null).map(Number);
 if(!rs.length)return{t:'na'};
 const d=+m.rate-Math.max(...rs);
 return d===0?{t:'eq'}:{t:d>0?'up':'down',d:Math.abs(d)};
}

  res.addEventListener('mouseout',e=>{if(lkPin)return;const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest('.cc:not(.ph)'):null;if(!to)lkFocus(null)});
  res.addEventListener('click',e=>{const c=e.target.closest('.cc:not(.ph)');if(!c)return;lkPin=lkPin===c.dataset.k?null:c.dataset.k;lkFocus(lkPin)});
  addEventListener('resize',()=>{if(lkOn)lkAlign()});$('lkGo').onclick=()=>compareMatrix();$('lkLive').onclick=()=>{stopPoll();lookup()};
  $('lkYear').innerHTML=Array.from({length:46},(_,i)=>1405-i).map(y=>'<option value="'+y+'">'+faYear(y)+'</option>').join('');
  $('lkYear').value='1397';
 }
 return reload=>{if(!started){started=true;init()}if((!CAT||reload)&&!loading)loadCatalog()};
})();
if(lkOn)openLookup(); // صفحه مستقیم با #lookup باز شده
// به‌روزرسانی خودکار: هر دقیقه (وقتی صفحه دیده می‌شود) و هر بار که کاربر به صفحه برمی‌گردد
setInterval(()=>{if(!document.hidden&&!lkOn)load(true)},AUTO_REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!lkOn)load(true)});
